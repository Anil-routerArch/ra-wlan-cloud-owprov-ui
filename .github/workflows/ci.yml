name: CI

on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - main
      - 'release/*'
      - 'anil-feature-ui'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'release/*'
      - 'anil-feature-ui'

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Run Vitest UI Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Vitest tests
      run: npm test -- --passWithNoTests

  build-bundle:
    name: Production UI Build Validation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Web Production Assets
      run: npm run build

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t owprov-ui:latest .
